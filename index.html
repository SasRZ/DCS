<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Biblioteca DCS</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acero:#151C23;--acero2:#1D272F;--linea:#2C3942;--texto:#DCE4E8;--tenue:#8A9AA5;
 --ambar:#E0A73C;--chart:#69A6A0;--alerta:#C9705A;--azul:#6C9BD1;--verde:#8DB56A;--lila:#A98BC4;box-sizing:border-box;
 padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--acero);color:var(--texto);
 font:400 16px/1.55 Barlow,system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.env{max-width:1080px;margin:0 auto;padding:0 20px 80px}
a{color:inherit;text-decoration:none}
h1{font:600 clamp(28px,6vw,44px)/1 "Barlow Condensed",sans-serif;margin:0 0 6px}
h2{font:600 22px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;color:var(--chart);
 margin:34px 0 0;padding-bottom:8px;border-bottom:1px solid var(--linea)}
header{padding:38px 0 22px;border-bottom:1px solid var(--linea)}
.lema{color:var(--tenue);margin:0;max-width:62ch}
.barra{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:20px 0 0}
#buscar{flex:1 1 240px;min-width:0;background:var(--acero2);border:1px solid var(--linea);
 border-radius:3px;color:var(--texto);font:inherit;padding:10px 13px}
#buscar::placeholder{color:var(--tenue)}
#buscar:focus{outline:2px solid var(--ambar);outline-offset:1px;border-color:transparent}
.cuenta{color:var(--tenue);font-size:14px;white-space:nowrap}
.miga{margin:22px 0 0;font-size:14px;color:var(--tenue)}
.miga a:hover{color:var(--ambar)}
.miga span.sep{margin:0 8px}

#avisos{margin-top:22px;border:1px solid var(--alerta);border-left-width:3px;padding:14px 16px;
 background:var(--acero2);font-size:14.5px}
#avisos h3{font:600 17px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;
 color:var(--alerta);margin:0 0 8px}
#avisos ul{margin:0;padding-left:20px;color:var(--tenue)}
#avisos[hidden]{display:none}

.portada{display:grid;gap:1px;background:var(--linea);border:1px solid var(--linea);margin-top:30px}
.portada a{background:var(--acero);padding:26px 22px;display:grid;
 grid-template-columns:1fr auto;gap:6px 20px;align-items:baseline}
.portada a:hover,.portada a:focus-visible{background:var(--acero2);outline:none}
.portada a:hover .pt,.portada a:focus-visible .pt{color:var(--ambar)}
.pt{font:600 28px/1 "Barlow Condensed",sans-serif}
.pd{grid-column:1;color:var(--tenue);max-width:60ch}
.pn{grid-row:1;grid-column:2;color:var(--tenue);font-size:14px;white-space:nowrap}

/* Categorías: cabecera de grupo y tarjetas con franja de color (--c lo fija cada grupo) */
.gcab{position:relative;display:grid;grid-template-columns:1fr auto;align-items:baseline;gap:4px 16px;
 margin-top:42px;padding:2px 0 2px 18px}
.gcab::before{content:"";position:absolute;left:0;top:4px;bottom:4px;width:6px;background:var(--c)}
.gcab h3{font:600 clamp(26px,4vw,36px)/1.05 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0}
.gcab .gn{font:600 32px/1 "Barlow Condensed",sans-serif;color:var(--c)}
.gcab p{grid-column:1/-1;margin:0;color:var(--tenue);font-size:15px;max-width:72ch}
.tarjetas{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:14px;margin-top:16px}
.tarjeta{position:relative;display:grid;grid-template-columns:1fr auto;gap:6px 12px;align-content:start;
 background:var(--acero2);border:1px solid var(--linea);border-radius:10px;padding:14px 16px 16px 28px}
.tarjeta::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:6px;background:var(--c)}
.tarjeta:hover,.tarjeta:focus-within{border-color:var(--c)}
.tarjeta:hover .tn,.tarjeta:focus-within .tn{color:var(--ambar)}
.tn{font:600 25px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.01em;outline:none}
.tn::after{content:"";position:absolute;inset:0;border-radius:10px}
.tn:focus-visible::after{outline:2px solid var(--ambar);outline-offset:2px}
.tarjetas.ancha{grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr))}
.mision .tn{font-size:36px;letter-spacing:.03em}
.vacia{opacity:.5}
.der{display:flex;gap:8px;align-items:center}
.chip{color:var(--c);border:1px solid var(--c);border-radius:4px;font-size:11px;font-weight:600;
 letter-spacing:.08em;padding:1px 7px;line-height:1.5}
.tarjeta .n{color:var(--tenue);font-size:13px;white-space:nowrap}
.rol{grid-column:1/-1;color:var(--tenue);font-size:14.5px;line-height:1.4}
.completo{grid-column:1/-1;color:var(--c);font-size:13.5px;font-weight:500;letter-spacing:.03em;margin-top:-2px}
.ads{grid-column:1/-1;font-size:14px}
.ads b{color:var(--c);font-weight:600}
.avs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:6px}
.avs .lbl{width:100%;color:var(--tenue);font-size:11.5px;letter-spacing:.09em;text-transform:uppercase}
.av{position:relative;z-index:1;font-size:12.5px;border:1px solid var(--linea);border-radius:4px;padding:1px 8px;
 background:var(--acero);color:var(--texto)}
a.av:hover,a.av:focus-visible{border-color:var(--ambar);color:var(--ambar);outline:none}
.av.off{color:var(--tenue)}

/* Ficha de módulo: foto y datos clave */
.ficha{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0;margin-top:22px;overflow:hidden;
 background:var(--acero2);border:1px solid var(--linea);border-radius:10px}
.foto{position:relative;margin:0;background:var(--acero);min-height:240px}
.foto img{display:block;width:100%;height:100%;max-height:420px;object-fit:cover}
.foto figcaption{position:absolute;left:0;right:0;bottom:0;padding:22px 14px 9px;font-size:11.5px;color:#d3dce1;
 background:linear-gradient(transparent,rgba(10,14,18,.82))}
.foto figcaption a{text-decoration:underline;text-underline-offset:2px}
.datos{padding:20px 24px 18px}
.datos h3{font:600 30px/1.1 "Barlow Condensed",sans-serif;letter-spacing:.02em;margin:0;color:var(--c)}
.rolmod{margin:6px 0 10px;color:var(--tenue);font-size:14.5px}
.ficha dl{margin:0}
.dfila{display:grid;grid-template-columns:118px 1fr;gap:14px;padding:9px 0;border-top:1px solid var(--linea)}
.dfila dt{color:var(--tenue);font-size:12px;letter-spacing:.09em;text-transform:uppercase;padding-top:2px}
.dfila dt small{display:block;text-transform:none;letter-spacing:0;font-size:11.5px}
.dfila dd{margin:0}
.armas{display:flex;flex-wrap:wrap;gap:6px}
.arma{border:1px solid var(--linea);border-radius:4px;padding:1px 9px;font-size:13.5px;background:var(--acero)}
.arma b{color:var(--c);font-weight:600}
.fuente{margin:12px 0 0;color:var(--tenue);font-size:12px;line-height:1.4}
.subt{font:600 24px/1 "Barlow Condensed",sans-serif;letter-spacing:.05em;color:var(--chart);margin:34px 0 4px;
 padding-bottom:8px;border-bottom:1px solid var(--linea)}
@media (max-width:760px){.ficha{grid-template-columns:1fr}.foto{min-height:200px}.datos{padding:16px 18px}
 .dfila{grid-template-columns:1fr;gap:2px}}

.doc{display:grid;grid-template-columns:1fr auto;gap:4px 18px;align-items:baseline;
 padding:14px 4px;border-bottom:1px solid var(--linea)}
.doc:hover,.doc:focus-visible{background:var(--acero2);outline:none}
.doc:hover .tit,.doc:focus-visible .tit{color:var(--ambar)}
.tit{font-weight:500}
.nota{grid-column:1;color:var(--tenue);font-size:14.5px;max-width:72ch}
.meta{grid-column:1;color:var(--tenue);font-size:13.5px}
.meta b{font-weight:400;color:var(--chart)}
.tipo{grid-row:1;grid-column:2;color:var(--tenue);font-size:13px;letter-spacing:.08em;
 border:1px solid var(--linea);border-radius:2px;padding:2px 7px}
.ruta{grid-row:1;grid-column:2;color:var(--tenue);font-size:13px;text-align:right;max-width:34ch}
.vacio{color:var(--tenue);padding:40px 4px}
.creditos{color:var(--tenue);font-size:14px;border:1px solid var(--linea);border-radius:3px;padding:6px 12px}
.creditos:hover,.creditos:focus-visible{color:var(--ambar);border-color:var(--ambar);outline:none}
.intro{color:var(--tenue);max-width:68ch;margin:18px 0 0}
.autor{padding:22px 4px;border-bottom:1px solid var(--linea)}
.autor h3{font:600 26px/1.1 "Barlow Condensed",sans-serif;margin:0}
.autor h3 a:hover{color:var(--ambar)}
.autor h3 .ext{color:var(--tenue);font-size:17px}
.autor p{color:var(--tenue);margin:6px 0 0;max-width:68ch}
.autor ul{margin:10px 0 0;padding-left:20px;font-size:14.5px}
.autor li a:hover{color:var(--ambar)}
.autor summary{cursor:pointer;color:var(--chart);font-size:14.5px;margin-top:10px}
footer{color:var(--tenue);font-size:14px;margin-top:48px;border-top:1px solid var(--linea);padding-top:16px}
code{background:var(--acero2);padding:1px 5px;border-radius:2px;font-size:.92em}
@media (prefers-reduced-motion:no-preference){.doc,.portada a{transition:background .12s}.tarjeta{transition:border-color .12s}}
</style>
</head>
<body>
<div class="env">
<header>
  <h1><a href="#/">Biblioteca DCS</a></h1>
  <p class="lema">Manuales, cartas, checklists y briefings. Ordenado como vuelas: por aparato, por teatro y por tipo de misión.</p>
  <div class="barra">
    <input id="buscar" type="search" placeholder="Buscar en todo: Viper, Kola, SEAD, TACAN…" autocomplete="off" disabled>
    <span class="cuenta" id="cuenta"></span>
    <a class="creditos" href="#/creditos">Créditos</a>
  </div>
</header>

<section id="avisos" hidden><h3>Revisar el catálogo</h3><ul id="avisos-lista"></ul></section>
<nav class="miga" id="miga"></nav>
<main id="vista"><p class="vacio">Cargando catálogo…</p></main>
<footer>Esta página está actualizada por Sas - <a href="https://escuadronfox3.com" target="_blank" rel="noopener">Escuadrón FOX3</a>. <a href="https://discord.gg/uGaFdpZhNh" target="_blank" rel="noopener">ÚNETE AQUÍ</a></footer>
</div>

<script>
const $ = id => document.getElementById(id);
const esc = t => { const e = document.createElement("div"); e.textContent = t ?? ""; return e.innerHTML; };

let arbol = {}, documentos = [], todos = [], creditos = [], datosMod = {}, idx = {}, porRef = new Map(), filtro = "";
/* ?todo en la dirección enseña también los apartados vacíos (atenuados) y los grupos ocultos, para revisar el catálogo */
const VER_TODO = /[?&]todo\b/.test(location.search);

/* ── Carga ── */
Promise.all([
  fetch("data/taxonomia.json").then(r => r.ok ? r.json() : Promise.reject("taxonomia.json: HTTP " + r.status)),
  fetch("data/documentos.json").then(r => r.ok ? r.json() : Promise.reject("documentos.json: HTTP " + r.status)),
  fetch("data/creditos.json").then(r => r.ok ? r.json() : []).catch(() => []),
  fetch("data/modulos.json").then(r => r.ok ? r.json() : {}).catch(() => ({}))
]).then(([t, d, c, dm]) => {
  arbol = t; todos = d; creditos = c; datosMod = dm || {};
  /* un grupo con "oculto": true no se pinta, y sus documentos no salen en búsqueda, recuentos ni créditos (siguen en los JSON) */
  const ocultos = new Set();
  if (!VER_TODO) for (const k in arbol) for (const g of arbol[k].grupos)
    if (g.oculto) for (const it of g.items) ocultos.add(k + "/" + it.id);
  documentos = todos.filter(x => !(x.refs || []).length || (x.refs || []).some(r => !ocultos.has(r)));
  construirIndice();
  validar(todos);
  $("buscar").disabled = false;
  pintar();
}).catch(err => {
  $("vista").innerHTML = '<p class="vacio">No se ha podido cargar el catálogo (' + esc(String(err)) +
    ').<br>Comprueba que sirves la carpeta por HTTP y que los JSON están en <code>data/</code> y son válidos.</p>';
});

/* ── Índice: una sola copia de cada documento, referenciada desde varios sitios ── */
function construirIndice(){
  idx = {}; porRef = new Map();
  for (const c in arbol)
    for (const g of arbol[c].grupos)
      for (const it of g.items) idx[c + "/" + it.id] = it.nombre;

  for (const doc of documentos)
    for (const ref of (doc.refs || [])) {
      if (!porRef.has(ref)) porRef.set(ref, []);
      porRef.get(ref).push(doc);
    }
}

/* ── Validación: duplicados y referencias rotas ── */
function validar(lista){
  const avisos = [], ids = new Set(), urls = new Map(), titulos = new Map();
  for (const d of lista) {
    if (!d.id) { avisos.push("Un documento no tiene <code>id</code>: " + esc(d.titulo || d.url || "?")); continue; }
    if (ids.has(d.id)) avisos.push("Id repetido: <code>" + esc(d.id) + "</code>");
    ids.add(d.id);

    const u = (d.url || "").toLowerCase();
    if (u) { if (urls.has(u)) avisos.push("El archivo <code>" + esc(d.url) + "</code> está en dos fichas: <code>" +
      esc(urls.get(u)) + "</code> y <code>" + esc(d.id) + "</code>. Usa una sola ficha con varias <code>refs</code>.");
      else urls.set(u, d.id); }

    const tt = (d.titulo || "").trim().toLowerCase();
    if (tt) { if (titulos.has(tt)) avisos.push("Dos documentos con el mismo título: <code>" +
      esc(titulos.get(tt)) + "</code> y <code>" + esc(d.id) + "</code>");
      else titulos.set(tt, d.id); }

    const vistas = new Set();
    for (const r of (d.refs || [])) {
      if (!(r in idx)) avisos.push("<code>" + esc(d.id) + "</code> apunta a una subcategoría inexistente: <code>" + esc(r) + "</code>");
      if (vistas.has(r)) avisos.push("<code>" + esc(d.id) + "</code> repite la referencia <code>" + esc(r) + "</code>");
      vistas.add(r);
    }
    if (!(d.refs || []).length) avisos.push("<code>" + esc(d.id) + "</code> no está en ninguna categoría (<code>refs</code> vacío)");
  }
  if (avisos.length) {
    $("avisos-lista").innerHTML = avisos.map(a => "<li>" + a + "</li>").join("");
    $("avisos").hidden = false;
  }
}

/* ── Pintado ── */
const cuentaCat = c => documentos.filter(d => (d.refs || []).some(r => r.startsWith(c + "/"))).length;
const cuentaSub = ref => (porRef.get(ref) || []).length;

/* Colores de grupo: el campo "color" de la taxonomía usa estos nombres */
const COLOR = {azul: "var(--azul)", ambar: "var(--ambar)", rojo: "var(--alerta)", teal: "var(--chart)",
               verde: "var(--verde)", lila: "var(--lila)"};

/* Mapas: cuántos aeródromos tienen cartas (docs/mapas/<mapa>/<icao>/cartas.pdf) y qué tipo de contenido hay, calculado de las fichas */
function extrasMapa(id){
  const ds = documentos.filter(d => (d.refs || []).includes("mapas/" + id));
  const aer = ds.filter(d => new RegExp("^docs/mapas/" + id + "/[a-z0-9]{4}/cartas\\.pdf$").test(d.url)).length;
  const tags = new Set(ds.flatMap(d => (d.etiquetas || []).map(t => t.toLowerCase())));
  const chips = [["cartas", "CARTAS"], ["en ruta", "EN RUTA"], ["aeródromos", "DIAGRAMAS"], ["helipuertos", "HELIPUERTOS"], ["fip", "FIP"]]
    .filter(([t]) => tags.has(t)).map(([, n]) => '<span class="chip">' + n + '</span>');
  return (aer ? '<span class="ads"><b>' + aer + '</b> ' + (aer === 1 ? 'aeródromo' : 'aeródromos') + ' con cartas</span>' : '') +
    (chips.length ? '<span class="avs">' + chips.join("") + '</span>' : '');
}

/* Tipos de misión: aviones típicos, enlazados a su módulo cuando ese módulo tiene documentos */
function extrasMision(it){
  const av = (it.modulos || []).filter(m => idx["modulos/" + m]).map(m => cuentaSub("modulos/" + m) > 0
    ? '<a class="av" href="#/modulos/' + m + '">' + esc(idx["modulos/" + m]) + '</a>'
    : '<span class="av off">' + esc(idx["modulos/" + m]) + '</span>');
  return av.length ? '<span class="avs"><span class="lbl">Aviones típicos</span>' + av.join("") + '</span>' : "";
}

/* La tarjeta entera es clicable a través del enlace del nombre (::after), para poder llevar otros enlaces dentro */
function tarjeta(c, it){
  const ref = c + "/" + it.id, n = cuentaSub(ref);
  const extra = c === "mapas" ? extrasMapa(it.id) : c === "misiones" ? extrasMision(it) : "";
  return '<div class="tarjeta' + (c === "misiones" ? ' mision' : '') + (n ? '' : ' vacia') + '">' +
    '<a class="tn" href="#/' + ref + '">' + esc(it.nombre) + '</a>' +
    '<span class="der">' + (it.chip ? '<span class="chip">' + esc(it.chip) + '</span>' : '') +
    '<span class="n">' + n + ' doc.</span></span>' +
    (it.completo ? '<span class="completo">' + esc(it.completo) + '</span>' : '') +
    (it.rol ? '<span class="rol">' + esc(it.rol) + '</span>' : '') + extra + '</div>';
}

/* Ficha de un módulo: foto (Wikimedia Commons, con su crédito) y datos clave de data/modulos.json */
function fichaModulo(id){
  const d = datosMod[id];
  if (!d || !d.foto) return "";
  let col = "var(--chart)", rol = "";
  for (const g of arbol.modulos.grupos) for (const it of g.items)
    if (it.id === id) { col = COLOR[g.color] || col; rol = it.rol || ""; }
  const f = d.foto, nombre = f.archivo;
  const src = "https://commons.wikimedia.org/wiki/Special:FilePath/" + encodeURIComponent(nombre) + "?width=1100";
  const pagina = "https://commons.wikimedia.org/wiki/File:" + encodeURIComponent(nombre.replace(/ /g, "_"));
  const lic = f.licencia_url ? '<a href="' + esc(f.licencia_url) + '" target="_blank" rel="noopener">' + esc(f.licencia) + '</a>' : esc(f.licencia);
  const fila = (k, v) => v ? '<div class="dfila"><dt>' + k + '</dt><dd>' + v + '</dd></div>' : '';
  const armas = (d.armas || []).length
    ? '<div class="armas">' + d.armas.map(a => '<span class="arma"><b>' + esc(a[0]) + '</b> ' + esc(a[1]) + '</span>').join("") + '</div>'
    : esc(d.armas_nota || "");
  return '<section class="ficha" style="--c:' + col + '">' +
    '<figure class="foto"><img src="' + src + '" alt="' + esc(f.alt || "") + '" loading="lazy" referrerpolicy="no-referrer">' +
    '<figcaption>Foto: ' + esc(f.autor) + ' · ' + lic + ' · <a href="' + pagina + '" target="_blank" rel="noopener">Wikimedia Commons</a></figcaption></figure>' +
    '<div class="datos"><h3>Datos clave</h3>' + (rol ? '<p class="rolmod">' + esc(rol) + '</p>' : '') +
    '<dl>' + fila("En servicio", esc(d.servicio)) + fila("Techo", esc(d.techo)) + fila("Autonomía", esc(d.autonomia)) +
    fila("Armamento" + ((d.armas || []).length ? '<small>alcance máx.</small>' : ''), armas) + '</dl>' +
    '<p class="fuente">' + esc(datosMod._fuente || "") + '</p></div></section>';
}

function fila(d, refActual){
  const otras = (d.refs || []).filter(r => r !== refActual && idx[r]);
  const der = refActual
    ? '<span class="tipo">' + esc(d.tipo) + '</span>'
    : '<span class="ruta">' + (d.refs || []).filter(r => idx[r]).map(r => esc(idx[r])).join(" · ") + '</span>';
  const ext = ' target="_blank" rel="noopener"';  /* todo documento se abre en pestaña nueva, para no salir de la biblioteca */
  const meta = [];
  if (d.autor) meta.push('Autor: <b>' + esc(d.autor) + '</b>');
  if (refActual && otras.length) meta.push('También en <b>' + otras.map(r => esc(idx[r])).join("</b>, <b>") + '</b>');
  return '<a class="doc" href="' + esc(d.url) + '"' + ext + '><span class="tit">' + esc(d.titulo) + '</span>' + der +
    (d.nota ? '<span class="nota">' + esc(d.nota) + '</span>' : '') +
    (meta.length ? '<span class="meta">' + meta.join(" · ") + '</span>' : '') +
    '</a>';
}

/* ── Créditos: autores de creditos.json + cualquier "autor" que aparezca en las fichas ── */
function paginaCreditos(){
  const autores = creditos.slice();
  for (const n of new Set(documentos.map(d => d.autor).filter(Boolean)))
    if (!autores.some(a => a.nombre === n)) autores.push({nombre: n});

  const bloques = autores.map(a => {
    const ds = documentos.filter(d => d.autor === a.nombre);
    const lista = '<ul>' + ds.map(d => '<li><a href="' + esc(d.url) + '" target="_blank" rel="noopener">' + esc(d.titulo) + '</a></li>').join("") + '</ul>';
    const nombre = a.url
      ? '<a href="' + esc(a.url) + '" target="_blank" rel="noopener">' + esc(a.nombre) + ' <span class="ext">↗</span></a>'
      : esc(a.nombre);
    return '<article class="autor"><h3>' + nombre + '</h3>' +
      (a.desc ? '<p>' + esc(a.desc) + '</p>' : '') +
      (!ds.length ? '' : ds.length <= 4 ? lista
        : '<details><summary>' + ds.length + ' documentos</summary>' + lista + '</details>') +
      '</article>';
  });
  return '<h2>Créditos</h2>' +
    '<p class="intro">Esta biblioteca es una recopilación de consulta personal. Los documentos son obra de sus autores, ' +
    'que aparecen aquí con su nombre y su enlace cuando lo hay. Todos los derechos son suyos.</p>' + bloques.join("");
}

function pintar(){
  const v = $("vista"), miga = $("miga");
  const ruta = (location.hash || "#/").slice(2).split("/").filter(Boolean);
  const sep = '<span class="sep">›</span>';

  if (filtro) {
    const r = documentos.filter(d => (
      d.titulo + " " + (d.nota || "") + " " + (d.autor || "") + " " + (d.etiquetas || []).join(" ") + " " +
      (d.refs || []).map(x => idx[x] || "").join(" ")).toLowerCase().includes(filtro));
    miga.innerHTML = '<a href="#/">Inicio</a>' + sep + 'Resultados';
    $("cuenta").textContent = r.length + (r.length === 1 ? " resultado" : " resultados");
    v.innerHTML = r.length ? r.map(d => fila(d, null)).join("")
      : '<p class="vacio">Sin resultados. Prueba con el aparato, el mapa, el tipo de misión o una etiqueta.</p>';
    return;
  }

  const [c, s] = ruta;

  if (c === "creditos") {
    miga.innerHTML = '<a href="#/">Inicio</a>' + sep + 'Créditos';
    $("cuenta").textContent = "";
    v.innerHTML = paginaCreditos();
    return;
  }

  if (c && arbol[c] && s) {
    const ref = c + "/" + s, r = porRef.get(ref) || [];
    miga.innerHTML = '<a href="#/">Inicio</a>' + sep + '<a href="#/' + c + '">' + esc(arbol[c].nombre) + '</a>' +
                     sep + esc(idx[ref] || s);
    $("cuenta").textContent = r.length + (r.length === 1 ? " documento" : " documentos");
    const ficha = c === "modulos" ? fichaModulo(s) : "";
    v.innerHTML = '<h2>' + esc(idx[ref] || s) + '</h2>' + ficha + (ficha ? '<h3 class="subt">Documentos</h3>' : '') +
      (r.length ? r.map(d => fila(d, ref)).join("")
      : '<p class="vacio">Todavía no hay nada aquí. Añade una ficha con <code>"refs": ["' + esc(ref) + '"]</code>.</p>');
    return;
  }

  if (c && arbol[c]) {
    miga.innerHTML = '<a href="#/">Inicio</a>' + sep + esc(arbol[c].nombre);
    $("cuenta").textContent = cuentaCat(c) + " documentos";
    /* los apartados sin documentos no se pintan (siguen en taxonomia.json y reaparecen al añadir una ficha) */
    v.innerHTML = arbol[c].grupos.filter(g => VER_TODO || !g.oculto).map(g => {
      const its = g.items.filter(it => VER_TODO || cuentaSub(c + "/" + it.id) > 0);
      if (!its.length) return "";
      const col = COLOR[g.color] || "var(--chart)";
      const cab = g.nombre ? '<div class="gcab"><h3>' + esc(g.nombre) + '</h3><span class="gn">' + its.length + '</span>' +
        (g.desc ? '<p>' + esc(g.desc) + '</p>' : '') + '</div>' : '';
      return '<section style="--c:' + col + '">' + cab + '<div class="tarjetas' + (c === "modulos" ? '' : ' ancha') + '">' +
        its.map(it => tarjeta(c, it)).join("") + '</div></section>';
    }).join("") || '<p class="vacio">Todavía no hay documentos en esta categoría.</p>';
    return;
  }

  miga.innerHTML = "";
  $("cuenta").textContent = documentos.length + " documentos";
  v.innerHTML = '<div class="portada">' + Object.entries(arbol).map(([k, a]) => {
    const subs = a.grupos.filter(g => VER_TODO || !g.oculto)
      .reduce((t, g) => t + g.items.filter(it => VER_TODO || cuentaSub(k + "/" + it.id) > 0).length, 0);
    return '<a href="#/' + k + '"><span class="pt">' + esc(a.nombre) + '</span>' +
      '<span class="pn">' + subs + ' apartados · ' + cuentaCat(k) + ' doc.</span>' +
      '<span class="pd">' + esc(a.desc) + '</span></a>';
  }).join("") + '</div>';
}

$("buscar").oninput = e => { filtro = e.target.value.trim().toLowerCase(); pintar(); };
addEventListener("hashchange", () => { $("buscar").value = ""; filtro = ""; pintar(); scrollTo(0, 0); });
</script>
